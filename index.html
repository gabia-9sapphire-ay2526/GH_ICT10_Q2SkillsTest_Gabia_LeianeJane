<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-Metal Elements</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="wrapper">
        <div class="banner">
            <h1>NON-METAL ELEMENTS</h1>
            <p>periodic table information finder</p>
        </div>

        <div class="content">
            <div class="alert alert-info">
                <strong>Instructions:</strong><br>
                Enter the symbol of a non-metal element (Example: H, O, Br, P, S).
            </div>

            <div class="mb-3">
                <label for="element_symbol" class="form-label fw-bold">Element Symbol</label>
                <input type="text" id="element_symbol" class="form-control" placeholder="Enter symbol (e.g., H, Cl, I)">
            </div>

            <button type="button" class="btn" py-click="check_element">CHECK DETAILS</button>

            <div class="receipt">
                <h3>RESULT</h3>
                <hr class="dash">
                <div id="result" style="text-align: center;">Element details will appear here ♡</div>
            </div>
        </div>
    </div>

    <footer class="text-center py-3 mt-auto fixed-bottom">
        Periodic Table Information Finder - 2nd Quarter Skills Test
    </footer>

    <script type="py" src="main.py"></script>
</body>
</html>
